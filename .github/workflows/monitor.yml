name: huashan-slot-monitor

on:
  schedule:
    # 每 5 分钟一轮；分钟 +2 偏移避开整点高峰（GitHub 官方建议：高峰在每小时 :00，
    # 排队任务可能被丢弃）。cron 为 UTC，中国无夏令时故偏移恒定。
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      force_remain:
        description: '测试用：强制 remainnum。"1"=作用于齐思思；"45011:1"=指定 doctorid'
        required: false
        default: ''
      skip_push:
        description: 'true=只跑流程不真正推送（空跑验证）'
        required: false
        default: 'false'

concurrency:                # 串行执行，避免状态竞争
  group: huashan-slot-monitor
  cancel-in-progress: false

permissions:
  contents: read            # 不回写仓库，只读即可

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3      # 正常 ~30 秒；超时即失败并触发通知邮件
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- 状态持久化：run_id 唯一 key（精确命中永不发生→每轮必存新条目），
      # restore-keys 前缀匹配取回最近一次。固定 key 的坑：cache 条目不可变，
      # 精确命中时不保存，state 会永远停在首次值。 ----
      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: state.json
          key: huashan-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            huashan-state-

      - name: Run monitor
        # 不用 continue-on-error：结构性错误需非零退出让 GitHub 发失败邮件（哨兵）
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          FORCE_REMAIN: ${{ github.event.inputs.force_remain }}
          SKIP_PUSH: ${{ github.event.inputs.skip_push || 'false' }}
          TZ: Asia/Shanghai
        run: python monitor.py

      - name: Show state
        if: always()
        run: cat state.json 2>/dev/null || echo "(no state.json)"
