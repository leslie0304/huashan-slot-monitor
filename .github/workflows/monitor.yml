name: huashan-slot-monitor

on:
  schedule:
    - cron: '17 */4 * * *'
    - cron: '43 2-23/4 * * *'
    - cron: '4 4 * * *'
    - cron: '36 9 * * *'
    - cron: '0 12 * * *'

  workflow_dispatch:
    inputs:
      force_remain:
        description: '测试用：强制 remainnum。"1"=作用于齐思思；"45011:1"=指定 doctorid'
        required: false
        default: ''
      skip_push:
        description: 'true=只跑流程不真正推送（空跑验证）'
        required: false
        default: 'false'

concurrency:
  group: huashan-slot-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: state.json
          key: huashan-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            huashan-state-

      - name: Run monitor loop (~5.5h, check every 5 min)
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          FORCE_REMAIN: ${{ github.event.inputs.force_remain }}
          SKIP_PUSH: ${{ github.event.inputs.skip_push || 'false' }}
          TZ: Asia/Shanghai
        run: |
          START=$(date +%s)
          RUN_MIN=330
          while true; do
            python monitor.py
            rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "::error::结构性错误，终止循环"
              exit 3
            fi
            NOW=$(date +%s)
            ELAPSED=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED" -ge "$RUN_MIN" ]; then
              echo "循环已达 ${RUN_MIN} 分钟，本轮结束"
              break
            fi
            sleep 300
          done

      - name: Show state
        if: always()
        run: cat state.json 2>/dev/null || echo "(no state.json)"
